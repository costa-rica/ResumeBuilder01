<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResumeBuilder01 - Home</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <!-- Spinner Overlay -->
    <div id="spinner-overlay" class="spinner-overlay hidden">
        <div class="spinner"></div>
        <p id="spinner-text" class="spinner-text"></p>
    </div>

    <div class="container">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold">ResumeBuilder01</h1>
            <p class="text-xl">Tailor your resume with AI</p>
        </header>

        {% if error %}
        <div class="section-card" style="border-color: #DC2626; background-color: #FEF2F2;">
            <strong style="color: #DC2626;">Error:</strong> {{ error }}
        </div>
        {% endif %}

        <form action="/submit" method="post" enctype="multipart/form-data" class="section-card">

            <div class="input-group">
                <label for="resume_file">1. Upload Resume (.docx)</label>
                <input type="file" name="resume_file" id="resume_file" accept=".docx" required>
            </div>

            <div class="input-group">
                <label for="job_description">2. Job Requirements</label>
                <textarea name="job_description" id="job_description" placeholder="Paste the job description here..."
                    required></textarea>
            </div>

            <div class="input-group">
                <label>3. Select Model</label>
                <div class="radio-group">
                    <label class="radio-item">
                        <input type="radio" name="model_choice" value="mistral:instruct" checked>
                        <span>mistral:instruct (Local)</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="model_choice" value="gpt-4o-mini">
                        <span>gpt-4o-mini (OpenAI)</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="model_choice" value="openai-gpt-oss-120b">
                        <span>openai-gpt-oss-120b (DoAI)</span>
                    </label>
                </div>
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn">Generate Tailored Resume</button>
            </div>
        </form>
    </div>

    <script src="/static/js/script.js"></script>
</body>

</html>
